[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "u1-critic-v63"
version = "6.3.0"
description = "Low-latency U1 Image Critic V6.3"
readme = "README_CN.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.scripts]
u1-critic-v63-run = "u1_critic_v63.run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
